<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyTroupe Form Responder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>TinyTroupe <span>Responder</span></h1>
            <p>Paste a Google Form URL and let an AI persona answer the questions for you.</p>
        </header>

        <section class="card form-section">
            <form id="responder-form">
                <div class="input-group">
                    <label for="form-url">Google Form URL</label>
                    <input type="url" id="form-url" name="url" placeholder="https://docs.google.com/forms/d/e/.../viewform" required>
                </div>
                
                <div id="personas-container">
                    <div class="persona-group">
                        <div class="input-group">
                            <label>Persona Description (Optional)</label>
                            <textarea class="persona-input" placeholder="e.g. You are a 30-year-old software engineer who loves hiking..." rows="3"></textarea>
                        </div>
                        
                        <div class="input-group">
                            <label>Number of Submissions</label>
                            <input type="number" class="submission-count" min="1" max="100" value="1" required>
                        </div>
                        <button type="button" class="remove-persona-btn hidden">Remove</button>
                    </div>
                </div>
                
                <button type="button" id="add-persona-btn" class="secondary-btn" style="margin-bottom: 2rem;">+ Add Another Persona</button>
                
                <button type="submit" id="submit-btn">
                    <span>Generate Answers</span>
                    <div class="loader" id="btn-loader"></div>
                </button>
            </form>
        </section>

        <section class="card results-section hidden" id="results-section">
            <h2 id="result-title">Results</h2>
            <p id="result-desc" class="subtitle"></p>
            
            <div id="answers-container" class="answers-container">
                <!-- Answers will be populated here -->
            </div>
            
            <button id="reset-btn" class="secondary-btn">Try Another Form</button>
        </section>

        <div id="error-message" class="error-message hidden"></div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
